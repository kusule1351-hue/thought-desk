[package]
name = "thought-desk"
version = "0.8.3"
description = "Thought Desk - a fast, local-first notes workspace"
authors = ["Kusule"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/kusule1351-hue/thought-desk"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# Updates from GitHub releases, and restarting into them.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
# Sync encryption (sync/crypto.rs).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
getrandom = "0.2"
# Wipes the vault key from memory (sync/crypto.rs, secrets.rs); already in the build.
zeroize = "1"

# Small, fast release binary: the app is mostly I/O bound, so favour size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# WebView2 COM access (versions pinned to match the ones wry uses) so we can
# ask the webview to trim its memory while the window is minimized.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
# DPAPI, to keep the sign-in encrypted on disk (secrets.rs). Already in the
# build through other crates; this only turns on its cryptography functions.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# The sign-in's keystore elsewhere (secrets.rs): the Keychain on macOS, the
# Secret Service on Linux, over D-Bus, with its cryptography in Rust (no OpenSSL).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
